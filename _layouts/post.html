---
layout: default
---
<article class="blog-post">
  <p><a href="{{ '/blog/' | relative_url }}">← 블로그 글 목록</a></p>
  <h1>{{ page.title }}</h1>
  <p><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y-%m-%d" }}</time></p>
  <div class="post-content">
    {{ content }}
  </div>
</article>
