- key: 자기소개
  value:
    - 저는 동물을 좋아하고, 궁금한 것을 그냥 지나치지 않는 호기심 많은 사람입니다.
    - 새로운 일을 배우고 다양한 경험을 하는 것을 좋아하며, 친구들과 함께할 때는 활발하고 밝은 분위기를 만드는 편입니다.
- key: 장래희망
  value:
    - 제 장래희망은 수의사입니다. 아픈 동물을 치료하고 건강을 지켜 주는 수의사의 모습이 멋있다고 생각합니다.
    - 동물의 행동과 몸에 대해 더 많이 배우고, 동물이 보내는 작은 신호도 잘 살필 수 있는 사람이 되고 싶습니다.
- key: 앞으로의 목표
  value:
    - 앞으로 동물에 관한 지식을 꾸준히 쌓고, 생명을 책임지는 마음과 배려심도 함께 키우겠습니다.
    - 동물과 사람 모두에게 믿음을 주는 수의사가 되기 위해 성실하게 노력하겠습니다.
